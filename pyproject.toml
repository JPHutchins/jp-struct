[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "jp-struct"
version = "0.0.0"
description = "A C-backed, inheritable Record/Struct base class for Python — fast import, fast type creation"
readme = "README.md"
# Floor matches the only verified/tested interpreter. The C has a pre-3.14
# annotation path (record_get_annotations), so lowering to >=3.11 is plausible
# once you build+test against it.
requires-python = ">=3.14"
authors = [{ name = "JP Hutchins", email = "jp@intercreate.io" }]

# The importable module is `record` (from record import Record); the C source
# is wired up in setup.py because setuptools does not yet support declaring
# ext_modules in pyproject.toml.

[dependency-groups]
# Everything needed to build, test, and benchmark. `make` installs these into
# .venv via `uv sync --no-install-project`.
dev = [
    "setuptools>=70",            # build_ext
    "pytest>=8",                 # tests
    "msgspec>=0.21",             # bench: comparison target
    "record-type>=2023.1.post1", # bench: comparison target (the `records` module)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
