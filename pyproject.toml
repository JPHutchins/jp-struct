[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jp-struct"
version = "0.0.0"
description = "A C-backed, inheritable Struct base class for Python — fast import, fast type creation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "JP Hutchins", email = "jp@intercreate.io" }]
license = "MIT"
license-files = ["LICENSE"]

# The importable module is `jpstruct` (from jpstruct import Struct); the C source
# is wired up in setup.py because setuptools does not yet support declaring
# ext_modules in pyproject.toml.

# The distribution is the extension and nothing else, so nothing is discovered.
[tool.setuptools]
py-modules = []
packages = []

[dependency-groups]
dev = [
    "setuptools>=77",            # build_ext
    "camas[mcp]==0.1.29",
]

[tool.uv.workspace]
members = ["bench", "tests", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
