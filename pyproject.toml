[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jp-struct"
version = "0.0.0"
description = "A C-backed, inheritable Struct base class for Python — fast import, fast type creation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "JP Hutchins", email = "jphutchins@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]

# The importable module is `jpstruct` (from jpstruct import Struct); the C source
# is wired up in setup.py because setuptools does not yet support declaring
# ext_modules in pyproject.toml.

# jpstruct/ holds no Python: the extension is built as its __init__, and the
# directory exists so that py.typed and the stub have somewhere to live.
[tool.setuptools]
py-modules = []
packages = ["jpstruct"]

[tool.setuptools.package-data]
jpstruct = ["py.typed", "__init__.pyi"]

[dependency-groups]
dev = ["setuptools>=77", "camas[mcp]==0.1.29"]

[tool.pyright]
# The mirror of mypy's --warn-unused-ignores. tests/typing/rejected.py asserts a
# diagnostic by suppressing it, so a suppression that stops being needed has to
# be an error itself or the assertion is not one -- and the divergences between
# the checkers mean some of those suppressions are pyright's alone.
reportUnnecessaryTypeIgnoreComment = "error"

[tool.uv]
# uv must never install this project. It is a C extension, and an editable
# install puts a finder on the path whose `jpstruct` is a namespace package
# over the repo directory -- which then shadows the wheel in the leg whose
# whole job is to import an installed one. CI passes --no-install-workspace for
# the same reason; this is that, for everyone who forgets. The extension comes
# from the in-place build or from a wheel, never from here.
package = false

[tool.uv.workspace]
members = ["bench", "tests", "tools"]

[tool.ruff]
# Lint only. There is no ruff format here and there should not be: CLAUDE.md
# says follow the style already in the code base, not a common one.
[tool.ruff.lint]
# Rules that find defects, not rules that have opinions about layout. E402 is
# in because setup.py and compile_flags.py both put an import after a
# sys.path.insert on purpose, and the suppression is worth having to write.
# PLE/PLW are pylint's defect rules; PLC and PLR are its opinions about
# layout and magic numbers, which fight ordinary test code. PLR0124 is the
# one refactor rule that finds a real mistake.
select = [
    "F",
    "E4",
    "E7",
    "E9",
    "E402",
    "B",
    "BLE",
    "FLY",
    "I",
    "PLE",
    "PLW",
    "PLR0124",
    "PYI",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
# The file exists to hold expressions a checker must reject, so of course they
# are pointless comparisons and useless attribute accesses. That is the test.
"tests/typing/rejected.py" = ["B015", "B018"]

[tool.pytest.ini_options]
# README.md is here because its examples are the only claims about the API
# written in prose, so they are run rather than proof-read. testpaths is what
# decides -- a --doctest-glob alone collects nothing outside it.
testpaths = ["tests", "README.md"]
addopts = "--doctest-glob=README.md"
